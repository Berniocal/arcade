name: Build licensed Lure of the Temptress DOS bundle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-lure.yml'
      - 'tools/build-lure.py'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify original freeware game and package it
        run: python tools/build-lure.py
      - name: Verify output
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('lure.jsdos') as z:
              names=z.namelist()
              assert '.jsdos/dosbox.conf' in names
              assert any(n.lower().endswith('lure.exe') for n in names)
              assert 'LURE-LICENSE.txt' in names
              print('Validated',len(names),'files')
          PY
      - name: Commit original game bundle for GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lure.jsdos
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle licensed original Lure of the Temptress'
            git push
          fi
