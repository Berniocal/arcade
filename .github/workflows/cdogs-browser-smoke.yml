name: C-Dogs SDL browser and mobile input smoke
on:
  workflow_dispatch:
  push:
    branches: [main, feature/cdogs-mobile]
    paths:
      - "cdogs.html"
      - "tests/cdogs_smoke.py"
      - "cdogs-runtime/**"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Assert built game exists and was not replaced with a mock
        run: |
          test -s cdogs-runtime/index.js
          test -s cdogs-runtime/index.wasm
          test -s cdogs-runtime/index.data
          test "$(head -c 4 cdogs-runtime/index.wasm | xxd -p)" = 0061736d
      - name: Browser startup, game pixels, touch controls and saving
        run: |
          python3 -m venv /tmp/cdogs-test
          /tmp/cdogs-test/bin/pip install --quiet playwright==1.56.0 pillow
          /usr/bin/google-chrome --version
          /tmp/cdogs-test/bin/python tests/cdogs_smoke.py
      - name: Upload canvas screenshot and UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdogs-mobile-browser-images
          path: |
            cdogs-smoke-landscape.png
            cdogs-smoke-ui.png
          if-no-files-found: ignore
          retention-days: 7
